version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: finfreelance_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    # Nessuna porta esposta all'host: accessibile solo dalla rete interna
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - finfreelance_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: finfreelance_redis
    restart: always
    # Nessuna porta esposta all'host
    volumes:
      - redis_data:/data
    networks:
      - finfreelance_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finfreelance_backend
    restart: always
    env_file:
      - ./backend/.env.production
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - finfreelance_network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  finfreelance_network:
    driver: bridge
